<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Share the secret</title>
        <link rel="stylesheet" type="text/css" href="/www/assets/css/bootstrap.min.css" />
        <link rel="icon" type="image/png" href="/www/assets/cgi-bin/favicon.png" />
    </head>
    <body>
        <p>Thank you for saving your secret value!</p>
        <p>To share your secret once, send anyone this one-time URL: <a id="secret_id"></a></p>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const secretId = urlParams.get("secret_id");
            const url = window.location.origin + "/secret/" + secretId;
            document.getElementById('secret_id').innerText = url;
            document.getElementById('secret_id').setAttribute("href", url);
        </script>
    </body>
</html>
