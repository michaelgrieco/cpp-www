<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fill out form</title>
        <link rel="stylesheet" href="/www/assets/css/bootstrap.min.css" />

        <script type="text/javascript">
            document.addEventListener('DOMContentLoaded', async () => {
                // get form ID
                const form = window.location.pathname.split('/').filter(Boolean).pop();
                if (!form) return;

                // get form description
                const res = await fetch(`/www/forms/${form}.json`);
                const data = await res.json();

                document.getElementById('form-title').textContent = data.title;

                const formEl = document.querySelector('form');
                //formEl.action = `/form/${form}`;

                const createFormItem = (item, wrapper) => {
                    let el = undefined;

                    // create form item
                    if (item.element === 'input') {
                        if (item.prompt) {
                            const label = document.createElement('label');
                            label.setAttribute('for', item.name);
                            label.className = 'form-label';
                            label.innerHTML = item.prompt;
                            wrapper.appendChild(label);
                        }

                        if (item.long) {
                            // Expandable long-form textarea
                            el = document.createElement('textarea');
                            el.name = item.name;
                            el.id = item.name;
                            el.className = 'form-control';
                            el.rows = 4;
                        } else if (item.type === 'checkbox' || item.type === 'radio') {
                            // Group of checkbox / radio options
                            for (const opt of (item.opts || [])) {
                                const optStr = typeof opt === 'string' ? opt : opt.text;

                                const optWrapper = document.createElement('div');
                                optWrapper.className = 'form-check px-4';

                                // create checkbox or radio button
                                const optInput = document.createElement('input');
                                optInput.type = item.type;
                                optInput.name = item.name;
                                //optInput.id = `${item.name}-${opt}`;
                                optInput.value = typeof opt === 'string' ? opt : opt.text;
                                optInput.className = 'form-check-input';
                                optWrapper.appendChild(optInput);

                                // create label
                                if (typeof opt === 'string') {
                                    const optLabel = document.createElement('label');
                                    optLabel.setAttribute('for', `${item.name}-${opt}`);
                                    optLabel.className = 'form-check-label';
                                    optLabel.textContent = opt;
                                    optWrapper.appendChild(optLabel);
                                }
                                else {
                                    createFormItem(opt, optWrapper);
                                }

                                wrapper.appendChild(optWrapper);
                            }
                            // attrs applied per-input above; skip the generic el path
                            el = null;
                        } else if (item.type === 'date') {
                            el = document.createElement('input');
                            el.type = 'date';
                            el.name = item.name;
                            el.id = item.name;
                            el.className = 'form-control';
                            // use placeholder as the default date value
                            if (item.attrs && item.attrs.placeholder) {
                                el.value = item.attrs.placeholder;
                            }
                        } else if (item.type === 'select') {
                            el = document.createElement('div');
                            el.className = 'dropdown';
                            el.id = item.name + '-dropdown';

                            // Create input search box
                            const searchInput = document.createElement('input');
                            searchInput.type = 'text';
                            searchInput.className = 'form-control';
                            searchInput.placeholder = 'Search...';
                            searchInput.setAttribute('autocomplete', 'off');

                            // Wrapper to hold value
                            const hiddenInput = document.createElement('input');
                            hiddenInput.type = 'hidden';
                            hiddenInput.name = item.name;
                            hiddenInput.id = item.name;

                            // Wrapper for options
                            const dropdownMenu = document.createElement('div');
                            dropdownMenu.className = 'dropdown-menu w-100';
                            dropdownMenu.style.maxHeight = '200px';
                            dropdownMenu.style.overflowY = 'auto';
                            dropdownMenu.style.display = 'none';

                            // Query available options
                            const opts = item.opts || [];
                            const renderOptions = (filter) => {
                                dropdownMenu.innerHTML = '';
                                const filtered = opts.filter(o => o.toLowerCase().includes(filter.toLowerCase()));
                                for (const opt of filtered) {
                                    const optEl = document.createElement('a');
                                    optEl.className = 'dropdown-item';
                                    optEl.href = '#';
                                    optEl.textContent = opt;
                                    optEl.addEventListener('mousedown', (e) => {
                                        e.preventDefault();
                                        searchInput.value = opt;
                                        hiddenInput.value = opt;
                                        dropdownMenu.style.display = 'none';
                                    });
                                    dropdownMenu.appendChild(optEl);
                                }
                            };

                            // New search
                            searchInput.addEventListener('input', () => {
                                renderOptions(searchInput.value);
                                dropdownMenu.style.display = 'block';
                            });

                            // Open menu
                            searchInput.addEventListener('focus', () => {
                                renderOptions(searchInput.value);
                                dropdownMenu.style.display = 'block';
                            });

                            // Hide menu
                            searchInput.addEventListener('blur', () => {
                                dropdownMenu.style.display = 'none';
                            });

                            // Add input elements to wrapper
                            el.appendChild(searchInput);
                            el.appendChild(hiddenInput);
                            el.appendChild(dropdownMenu);
                        } else {
                            el = document.createElement('input');
                            el.type = item.type || 'text';
                            el.name = item.name;
                            el.id = item.name;
                            el.className = 'form-control';
                        }
                    } else {
                        el = document.createElement(item.element);
                        if (item.text) el.innerHTML = item.text;
                    }

                    // set attributes
                    if (el) {
                        if (item.attrs) {
                            for (const [attr, value] of Object.entries(item.attrs)) {
                                el.setAttribute(attr, value);
                            }
                        }
                        wrapper.appendChild(el);
                    }
                    if (item.children) {
                        for (const child of item.children) {
                            createFormItem(child, wrapper);
                        }
                    }
                };

                for (const item of data.elements) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'mb-3 ' + item.wrapperClassName;
                    createFormItem(item, wrapper);
                    formEl.appendChild(wrapper);
                }

                // insert button
                const btn = document.createElement('button');
                btn.setAttribute("type", "submit");
                btn.setAttribute("name", "submit");
                btn.setAttribute("class", "btn btn-primary");
                btn.textContent = "Submit"
                formEl.appendChild(btn);

                // intercept form submission
                formEl.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const submitRes = await fetch(formEl.action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams(new FormData(formEl)).toString()
                    });
                    if (submitRes.status === 400 || submitRes.status === 404) {
                        alert(await submitRes.text());
                    } else {
                        window.location.href = submitRes.url;
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <h5 class="mb-3" id="form-title">Form Title</h5>
                    <form method="POST">
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
